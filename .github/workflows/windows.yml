name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**","src-tauri/**","package.json","vite.config.ts","vitest.config.ts",".github/workflows/windows.yml"]
concurrency:
  group: bridge-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install -y nsis
      - run: npm install
      - run: npx tauri icon src-tauri/icons/bridge.svg --output src-tauri/icons
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run test
      - run: npm run build
      - name: Build Windows installer
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
