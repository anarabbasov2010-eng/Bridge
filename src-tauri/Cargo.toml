[package]
name="bridge"
version="0.1.0"
description="Bridge cross-device companion"
authors=["Bridge contributors"]
edition="2021"
[lib]
name="bridge_lib"
crate-type=["staticlib","cdylib","rlib"]
[build-dependencies]
tauri-build={version="2",features=[]}
[dependencies]
tauri={version="2",features=[]}
serde={version="1",features=["derive"]}
serde_json="1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread", "macros", "sync"] }
